[package]
name = "archforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AI-powered TUI for PKGBUILD generation and AUR management"

[dependencies]
# Workspace deps
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
dirs.workspace = true

# HTTP client for AUR queries
reqwest = { version = "0.11", features = ["json", "blocking"] }

# URL encoding
urlencoding = "2.1"

# TUI
ratatui = { version = "0.25", optional = true }
crossterm = { version = "0.27", features = ["events"], optional = true }

# Terminal detection
atty = "0.2"

# File system utilities
walkdir = "2.4"

# Async runtime for future use
async-trait = "0.1"

[features]
default = ["tui"]
tui = ["ratatui", "crossterm"]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"