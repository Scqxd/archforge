[workspace]
resolver = "2"
members = [
    "archforge",
    "build",
    "deploy",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["ArchForge Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive", "cargo", "env"] }

# Concurrency
futures = "0.3"
async-trait = "0.1"

# Utilities
dirs = "5"
home = "0.5"
tempfile = "3"